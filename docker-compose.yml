services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: clareira
      POSTGRES_USER: clareira
      POSTGRES_PASSWORD: clareira
    ports:
      # 5433 no host para não brigar com um Postgres local na 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clareira -d clareira"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
